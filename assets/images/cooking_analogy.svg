<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <defs>
    <linearGradient id="cookGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4FCFA" />
    </linearGradient>
    <linearGradient id="cookNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#446491" />
      <stop offset="100%" stop-color="#223654" />
    </linearGradient>
    <linearGradient id="cookOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B89AC" />
      <stop offset="100%" stop-color="#2D5C79" />
    </linearGradient>
    <filter id="cookCardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#122034" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect x="2" y="2" width="756" height="436" rx="14" fill="url(#cookGradBg)" stroke="#ACE6F6" stroke-width="1.8" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(18, 14)">
    <!-- Title Pill -->
    <rect x="0" y="0" width="310" height="32" rx="8" fill="url(#cookNavy)" />
    <text x="155" y="21" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.4">
      ANALOGÍA: 1 CHEF EN LA COCINA
    </text>

    <!-- Concept Mapping Pill -->
    <rect x="524" y="0" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#4B89AC" stroke-width="1.5" />
    <circle cx="542" cy="16" r="9" fill="#4B89AC" />
    <text x="542" y="20" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" text-anchor="middle">1</text>
    <text x="626" y="21" fill="#223654" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle">
      1 Chef = 1 Núcleo de CPU
    </text>
  </g>

  <!-- ================= 3 TASK CARDS ================= -->

  <!-- Card 1: Olla / I/O -->
  <g transform="translate(18, 56)" filter="url(#cookCardShadow)">
    <rect width="228" height="175" rx="10" fill="#FFFFFF" stroke="#D3E7EE" stroke-width="1.5" />
    <rect width="228" height="32" rx="10" fill="url(#cookNavy)" />
    <rect y="16" width="228" height="16" fill="url(#cookNavy)" />
    <text x="114" y="21" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      1. Hervir Pasta
    </text>

    <!-- Vector Icon: Pot -->
    <g transform="translate(50, 44)">
      <!-- Steam -->
      <path d="M 46 14 Q 49 5 46 0 M 64 14 Q 67 5 64 0 M 82 14 Q 85 5 82 0" stroke="#4B89AC" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Handles -->
      <path d="M 22 24 L 30 24 M 98 24 L 106 24" stroke="#446491" stroke-width="3" stroke-linecap="round" />
      <!-- Pot -->
      <path d="M 30 18 L 98 18 L 93 54 C 93 62 82 66 64 66 C 46 66 35 62 35 54 Z" fill="#E8F7F9" stroke="#446491" stroke-width="1.8" />
      <!-- Water line -->
      <line x1="38" y1="30" x2="90" y2="30" stroke="#4B89AC" stroke-width="1.5" stroke-dasharray="4,2" />
      <!-- Bubbles -->
      <circle cx="50" cy="42" r="2.5" fill="#FFFFFF" stroke="#4B89AC" stroke-width="1" />
      <circle cx="68" cy="46" r="2" fill="#FFFFFF" stroke="#4B89AC" stroke-width="1" />
      <circle cx="78" cy="38" r="2.5" fill="#FFFFFF" stroke="#4B89AC" stroke-width="1" />
    </g>

    <!-- Concept Badge -->
    <rect x="20" y="126" width="188" height="32" rx="6" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1.2" />
    <text x="114" y="146" fill="#1F3A5E" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
      Espera de I/O (Red / Disco)
    </text>
  </g>

  <!-- Card 2: Picar / CPU -->
  <g transform="translate(266, 56)" filter="url(#cookCardShadow)">
    <rect width="228" height="175" rx="10" fill="#FFFFFF" stroke="#D3E7EE" stroke-width="1.5" />
    <rect width="228" height="32" rx="10" fill="url(#cookOcean)" />
    <rect y="16" width="228" height="16" fill="url(#cookOcean)" />
    <text x="114" y="21" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      2. Cortar Verduras
    </text>

    <!-- Vector Icon: Cutting Board & Knife -->
    <g transform="translate(50, 44)">
      <!-- Board -->
      <rect x="22" y="14" width="84" height="48" rx="6" fill="#F0FAF8" stroke="#4B89AC" stroke-width="1.8" />
      <!-- Chopped items -->
      <circle cx="44" cy="36" r="6" fill="#446491" />
      <circle cx="58" cy="32" r="5" fill="#4B89AC" />
      <circle cx="72" cy="38" r="6.5" fill="#223654" />
      <rect x="52" y="44" width="10" height="4" rx="1" fill="#ACE6F6" stroke="#4B89AC" stroke-width="1" />
      <!-- Knife -->
      <path d="M 28 8 L 92 24 L 86 32 L 28 16 Z" fill="#ACE6F6" stroke="#223654" stroke-width="1.6" />
      <rect x="18" y="7" width="14" height="7" rx="2" fill="#446491" transform="rotate(15 24 10)" />
    </g>

    <!-- Concept Badge -->
    <rect x="20" y="126" width="188" height="32" rx="6" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1.2" />
    <text x="114" y="146" fill="#1F3A5E" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
      Cómputo Activo de CPU
    </text>
  </g>

  <!-- Card 3: Horno / Polling -->
  <g transform="translate(514, 56)" filter="url(#cookCardShadow)">
    <rect width="228" height="175" rx="10" fill="#FFFFFF" stroke="#D3E7EE" stroke-width="1.5" />
    <rect width="228" height="32" rx="10" fill="url(#cookNavy)" />
    <rect y="16" width="228" height="16" fill="url(#cookNavy)" />
    <text x="114" y="21" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      3. Revisar Horno
    </text>

    <!-- Vector Icon: Oven -->
    <g transform="translate(50, 44)">
      <!-- Oven box -->
      <rect x="22" y="8" width="84" height="54" rx="6" fill="#F0F6FA" stroke="#223654" stroke-width="1.8" />
      <!-- Window -->
      <rect x="30" y="16" width="68" height="30" rx="4" fill="#FFF8E7" stroke="#4B89AC" stroke-width="1.2" />
      <ellipse cx="64" cy="31" rx="14" ry="7" fill="#446491" opacity="0.85" />
      <!-- Dials -->
      <circle cx="40" cy="53" r="2.5" fill="#223654" />
      <circle cx="52" cy="53" r="2.5" fill="#223654" />
      <rect x="68" y="50" width="20" height="6" rx="2" fill="#223654" />
      <text x="78" y="55" fill="#ACE6F6" font-family="monospace" font-size="6" font-weight="900" text-anchor="middle">180°</text>
    </g>

    <!-- Concept Badge -->
    <rect x="20" y="126" width="188" height="32" rx="6" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1.2" />
    <text x="114" y="146" fill="#1F3A5E" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
      Polling / Eventos Rápidos
    </text>
  </g>

  <!-- ================= BOTTOM TIMELINE SECTION ================= -->
  <g transform="translate(18, 244)" filter="url(#cookCardShadow)">
    <rect width="724" height="180" rx="10" fill="#FFFFFF" stroke="#ACE6F6" stroke-width="1.5" />

    <!-- Timeline Header -->
    <text x="20" y="24" fill="#223654" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">
      LÍNEA DE TIEMPO INTERCALADA (1 NÚCLEO)
    </text>
    <rect x="626" y="10" width="80" height="20" rx="4" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1" />
    <text x="666" y="24" fill="#446491" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      Tiempo →
    </text>

    <!-- 4 Timeline Step Pills -->
    <!-- Step 1 -->
    <g transform="translate(18, 40)">
      <rect width="144" height="54" rx="8" fill="url(#cookNavy)" />
      <text x="72" y="23" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle">
        Poner Olla
      </text>
      <text x="72" y="41" fill="#ACE6F6" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        Inicia I/O (Espera)
      </text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(166, 62)">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#4B89AC" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="16,5 10,1 10,9" fill="#4B89AC" />
    </g>

    <!-- Step 2 -->
    <g transform="translate(186, 40)">
      <rect width="158" height="54" rx="8" fill="url(#cookOcean)" />
      <text x="79" y="23" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle">
        Cortar Verduras
      </text>
      <text x="79" y="41" fill="#E4FCF9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        Cómputo en CPU
      </text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(348, 62)">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#4B89AC" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="16,5 10,1 10,9" fill="#4B89AC" />
    </g>

    <!-- Step 3 -->
    <g transform="translate(368, 40)">
      <rect width="144" height="54" rx="8" fill="url(#cookNavy)" />
      <text x="72" y="23" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle">
        Mirar Horno
      </text>
      <text x="72" y="41" fill="#ACE6F6" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        Polling / Evento
      </text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(516, 62)">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#4B89AC" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="16,5 10,1 10,9" fill="#4B89AC" />
    </g>

    <!-- Step 4 -->
    <g transform="translate(536, 40)">
      <rect width="168" height="54" rx="8" fill="url(#cookOcean)" />
      <text x="84" y="23" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle">
        Servir la Pasta
      </text>
      <text x="84" y="41" fill="#E4FCF9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        Completa las Tareas
      </text>
    </g>

    <!-- Minimalist Takeaway Banner -->
    <rect x="18" y="108" width="686" height="54" rx="8" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1.2" />
    <g transform="translate(32, 118)">
      <!-- Icon -->
      <circle cx="12" cy="18" r="11" fill="#446491" />
      <path d="M 7 18 L 11 22 L 17 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Punchy Message -->
      <text x="34" y="16" fill="#122034" font-family="'Outfit', sans-serif" font-size="12.5" font-weight="800">
        Idea Clave: El chef no se queda de brazos cruzados esperando que el agua hierva.
      </text>
      <text x="34" y="32" fill="#31607C" font-family="'Inter', sans-serif" font-size="11" font-weight="600">
        Aprovecha las esperas pasivas (I/O) para avanzar otras tareas en el procesador sin duplicar recursos.
      </text>
    </g>
  </g>
</svg>
