      <text x="48" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 1</text>
      <text x="155" y="23" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#4B89AC">GIL Propio</text>
