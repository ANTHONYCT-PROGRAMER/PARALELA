      <rect x="8" y="8" width="80" height="22" rx="4" fill="#446491"/>
      <text x="48" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 3</text>
      <text x="155" y="23" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#4B89AC">GIL Propio</text>
