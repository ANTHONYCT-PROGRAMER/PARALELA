<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <linearGradient id="mpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2FBFA"/>
    </linearGradient>
    <filter id="mpSh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#446491" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="500" height="300" rx="14" fill="url(#mpBg)" stroke="#446491" stroke-width="2" filter="url(#mpSh)"/>
  
  <rect x="10" y="10" width="500" height="38" rx="14" fill="#4B89AC"/>
  <rect x="10" y="32" width="500" height="16" fill="#4B89AC"/>
  <text x="260" y="34" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    PARALELISMO REAL: MULTIPROCESSING EN 4 NÚCLEOS
  </text>

