      <text x="48" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 2</text>
      <text x="155" y="23" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#4B89AC">GIL Propio</text>
      <rect x="8" y="38" width="209" height="28" rx="4" fill="#E4FCF9"/>
      <text x="112" y="56" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#446491" text-anchor="middle">Núcleo Físico 2 (100% CPU)</text>
