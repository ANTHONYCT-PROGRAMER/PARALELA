<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="p3GradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1FCFA" />
    </linearGradient>
    <linearGradient id="p3GradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#446491" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>
    <filter id="p3Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#122034" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="316" height="156" rx="10" fill="url(#p3GradBg)" stroke="#ACE6F6" stroke-width="1.5" />

  <!-- Structure Badge -->
  <rect x="12" y="10" width="104" height="24" rx="5" fill="url(#p3GradNavy)" filter="url(#p3Shadow)" />
  <text x="64" y="26" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" text-anchor="middle">ESTRUCTURA</text>

  <rect x="122" y="10" width="186" height="24" rx="5" fill="#FFFFFF" stroke="rgba(75, 137, 172, 0.3)" />
  <text x="215" y="26" fill="#122034" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Módulos Desacoplados</text>

  <!-- Pipeline: Producer -> Queue/Channel -> Worker -->
  <g transform="translate(12, 44)" filter="url(#p3Shadow)">
    <!-- Producer Box -->
    <rect x="0" y="0" width="82" height="48" rx="6" fill="#446491" stroke="#ACE6F6" stroke-width="1" />
    <text x="41" y="22" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" text-anchor="middle">Productor</text>
    <text x="41" y="38" fill="#ACE6F6" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Genera Eventos</text>

    <!-- Arrow 1 -->
    <line x1="86" y1="24" x2="102" y2="24" stroke="#4B89AC" stroke-width="2" />
    <polygon points="106,24 100,20 100,28" fill="#4B89AC" />

    <!-- Queue / Buffer Box -->
    <rect x="110" y="0" width="76" height="48" rx="6" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1.2" />
    <text x="148" y="20" fill="#122034" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" text-anchor="middle">Cola / Canal</text>
    <rect x="116" y="28" width="16" height="12" rx="2" fill="#ACE6F6" />
    <rect x="138" y="28" width="16" height="12" rx="2" fill="#4B89AC" />
    <rect x="160" y="28" width="16" height="12" rx="2" fill="#446491" />

    <!-- Arrow 2 -->
    <line x1="190" y1="24" x2="206" y2="24" stroke="#4B89AC" stroke-width="2" />
    <polygon points="210,24 204,20 204,28" fill="#4B89AC" />

    <!-- Consumer / Worker Box -->
    <rect x="214" y="0" width="82" height="48" rx="6" fill="#243B55" stroke="#ACE6F6" stroke-width="1" />
    <text x="255" y="22" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" text-anchor="middle">Consumidor</text>
    <text x="255" y="38" fill="#ACE6F6" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Procesa Asíncrono</text>
  </g>

  <!-- Footer Tag -->
  <rect x="12" y="104" width="296" height="44" rx="6" fill="#FFFFFF" stroke="rgba(75, 137, 172, 0.3)" />
  <circle cx="28" cy="126" r="10" fill="#243B55" />
  <text x="28" y="130" fill="#ACE6F6" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" text-anchor="middle">3</text>
  <text x="46" y="120" fill="#122034" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="800">Diseño Modular y Responsivo</text>
  <text x="46" y="136" fill="#566E87" font-family="'Inter', sans-serif" font-size="8.5">Estructuración limpia mediante canales y colas</text>
</svg>
