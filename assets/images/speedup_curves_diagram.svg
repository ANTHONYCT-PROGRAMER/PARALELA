<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4FCFA"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#446491"/>
      <stop offset="100%" stop-color="#4B89AC"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#122034" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="576" height="316" rx="12" fill="url(#bgGrad)" stroke="#ACE6F6" stroke-width="1.8" filter="url(#shadow)"/>

  <!-- Title Header Bar -->
  <rect x="2" y="2" width="576" height="36" rx="12" fill="url(#headerGrad)"/>
  <rect x="2" y="20" width="576" height="18" fill="url(#headerGrad)"/>
  <text x="290" y="23" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
    Curvas de Comportamiento del Speedup (S vs p)
  </text>

  <!-- Grid & Plot Area (Origin at X: 70, Y: 245) -->
  <!-- Width: 380, Height: 180 -->
  <g transform="translate(70, 50)">
    
    <!-- Background grid lines -->
    <line x1="0" y1="180" x2="380" y2="180" stroke="#CBDCE6" stroke-width="1.2"/>
    <line x1="0" y1="135" x2="380" y2="135" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="90" x2="380" y2="90" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="45" x2="380" y2="45" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="380" y2="0" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>

    <line x1="0" y1="0" x2="0" y2="180" stroke="#CBDCE6" stroke-width="1.2"/>
    <line x1="95" y1="0" x2="95" y2="180" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="190" y1="0" x2="190" y2="180" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="285" y1="0" x2="285" y2="180" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="380" y1="0" x2="380" y2="180" stroke="#E2EFF5" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Axis Labels Y (Speedup) -->
    <text x="-12" y="184" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="end">1x</text>
    <text x="-12" y="139" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="end">4x</text>
    <text x="-12" y="94" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="end">8x</text>
    <text x="-12" y="49" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="end">12x</text>
    <text x="-12" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="end">16x</text>

    <!-- Axis Title Y -->
    <text x="-46" y="95" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="800" fill="#223654" text-anchor="middle" transform="rotate(-90, -46, 95)">
      Speedup (S)
    </text>

    <!-- Axis Labels X (Processors) -->
    <text x="0" y="196" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="middle">p=1</text>
    <text x="95" y="196" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="middle">p=4</text>
    <text x="190" y="196" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="middle">p=8</text>
    <text x="285" y="196" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="middle">p=12</text>
    <text x="380" y="196" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#446491" text-anchor="middle">p=16</text>

    <!-- Axis Title X -->
    <text x="190" y="214" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="800" fill="#223654" text-anchor="middle">
      Número de Procesadores / Núcleos (p)
    </text>

    <!-- CURVE 1: Superlineal (Above ideal, due to L2/L3 cache) -->
    <path d="M 0 180 Q 80 100 170 40 Q 250 15 350 10" fill="none" stroke="#2B7A78" stroke-width="2.5" stroke-dasharray="4,2"/>
    <circle cx="120" cy="74" r="4" fill="#2B7A78"/>

    <!-- CURVE 2: Ideal Linear (S = p) -->
    <line x1="0" y1="180" x2="380" y2="0" stroke="#446491" stroke-width="2.2" stroke-dasharray="5,4"/>
    <circle cx="95" cy="135" r="3.5" fill="#446491"/>
    <circle cx="190" cy="90" r="3.5" fill="#446491"/>
    <circle cx="285" cy="45" r="3.5" fill="#446491"/>
    <circle cx="380" cy="0" r="3.5" fill="#446491"/>

    <!-- CURVE 3: Real Sublineal (Overhead & Contention) -->
    <path d="M 0 180 Q 95 142 190 115 Q 285 98 380 90" fill="none" stroke="#E05D5D" stroke-width="3"/>
    <circle cx="95" cy="142" r="4" fill="#E05D5D"/>
    <circle cx="190" cy="115" r="4" fill="#E05D5D"/>
    <circle cx="380" cy="90" r="4" fill="#E05D5D"/>

    <!-- CURVE 4: Asymptotic Amdahl Limit line -->
    <line x1="160" y1="80" x2="380" y2="80" stroke="#8898AA" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="375" y="74" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#566E87" text-anchor="end">
      Límite Asintótico de Amdahl
    </text>

    <!-- Callout Tags on plot -->
    <g transform="translate(195, 30)">
      <rect width="170" height="20" rx="4" fill="#E4FCF9" stroke="#2B7A78" stroke-width="1"/>
      <text x="85" y="14" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#144644" text-anchor="middle">
        Superlineal (S &gt; p) • Efecto Caché
      </text>
    </g>

    <g transform="translate(260, 110)">
      <rect width="115" height="20" rx="4" fill="#FFF0F0" stroke="#E05D5D" stroke-width="1"/>
      <text x="57" y="14" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#A82828" text-anchor="middle">
        Real (S &lt; p) • Overhead
      </text>
    </g>
  </g>

  <!-- Legend Bottom Row -->
  <g transform="translate(20, 282)">
    <!-- Item 1: Superlinear -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="8" x2="22" y2="8" stroke="#2B7A78" stroke-width="2.5" stroke-dasharray="4,2"/>
      <circle cx="11" cy="8" r="3" fill="#2B7A78"/>
      <text x="28" y="12" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#144644">Superlineal (S &gt; p)</text>
    </g>

    <!-- Item 2: Ideal Linear -->
    <g transform="translate(150, 0)">
      <line x1="0" y1="8" x2="22" y2="8" stroke="#446491" stroke-width="2" stroke-dasharray="5,3"/>
      <circle cx="11" cy="8" r="3" fill="#446491"/>
      <text x="28" y="12" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#223654">Ideal Lineal (S = p)</text>
    </g>

    <!-- Item 3: Real Sublinear -->
    <g transform="translate(295, 0)">
      <line x1="0" y1="8" x2="22" y2="8" stroke="#E05D5D" stroke-width="2.5"/>
      <circle cx="11" cy="8" r="3" fill="#E05D5D"/>
      <text x="28" y="12" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#7A1D1D">Real Sublineal (S &lt; p)</text>
    </g>

    <!-- Item 4: Amdahl Bound -->
    <g transform="translate(445, 0)">
      <line x1="0" y1="8" x2="22" y2="8" stroke="#8898AA" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="28" y="12" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#566E87">Límite Amdahl</text>
    </g>
  </g>
</svg>
