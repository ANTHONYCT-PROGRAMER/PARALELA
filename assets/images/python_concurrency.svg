<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2FBFA"/>
    </linearGradient>
    <filter id="pyShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#446491" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left: Threading + GIL -->
  <g transform="translate(15, 15)">
    <rect width="380" height="330" rx="16" fill="url(#pGrad)" stroke="#4B89AC" stroke-width="2" filter="url(#pyShadow)"/>
    <rect width="380" height="42" rx="16" fill="#446491"/>
    <rect y="24" width="380" height="18" fill="#446491"/>
    <text x="190" y="28" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      PYTHON `threading` (CONCURRENCIA)
    </text>

    <!-- 1 Process Container -->
    <rect x="25" y="60" width="330" height="175" rx="10" fill="#FFFFFF" stroke="#446491" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="35" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#446491">1 Proceso de Python (PID)</text>
    
    <!-- Shared Memory -->
    <rect x="35" y="88" width="310" height="28" rx="6" fill="#E4FCF9"/>
    <text x="190" y="106" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#446491" text-anchor="middle">
      Espacio de Memoria Compartida
    </text>

    <!-- GIL Lock Bar -->
    <rect x="35" y="124" width="310" height="30" rx="6" fill="#446491"/>
    <text x="190" y="143" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ACE6F6" text-anchor="middle">
      🔒 GIL (Global Interpreter Lock)
    </text>

    <!-- Threads competing for 1 lock -->
    <rect x="45" y="165" width="85" height="55" rx="6" fill="#4B89AC"/>
    <text x="87" y="185" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hilo 1</text>
    <text x="87" y="205" font-family="'Inter', sans-serif" font-size="9" fill="#E4FCF9" text-anchor="middle">Activo (GIL)</text>

    <rect x="148" y="165" width="85" height="55" rx="6" fill="#A0BAC8"/>
    <text x="190" y="185" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hilo 2</text>
    <text x="190" y="205" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Esperando...</text>

    <rect x="250" y="165" width="85" height="55" rx="6" fill="#A0BAC8"/>
    <text x="292" y="185" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hilo 3</text>
    <text x="292" y="205" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Esperando...</text>

    <!-- Bottom Verdict -->
    <rect x="25" y="248" width="330" height="68" rx="8" fill="#E4FCF9" stroke="#ACE6F6" stroke-width="1.5"/>
    <text x="35" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#446491">
      ✔ Recomendado para: I/O Bound
    </text>
    <text x="35" y="286" font-family="'Inter', sans-serif" font-size="10" fill="#4B89AC">
      Descargas web, lectura de archivos, sockets.
    </text>
    <text x="35" y="304" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#D32F2F">
      ✖ No acelera operaciones CPU Bound.
    </text>
  </g>

  <!-- Right: Multiprocessing (Parallelism) -->
  <g transform="translate(425, 15)">
    <rect width="380" height="330" rx="16" fill="url(#pGrad)" stroke="#446491" stroke-width="2" filter="url(#pyShadow)"/>
    <rect width="380" height="42" rx="16" fill="#4B89AC"/>
    <rect y="24" width="380" height="18" fill="#4B89AC"/>
    <text x="190" y="28" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      PYTHON `multiprocessing` (PARALELISMO)
    </text>

    <!-- 4 Independent Processes -->
    <g transform="translate(25, 60)">
      <!-- Proc 1 -->
      <rect x="0" y="0" width="155" height="82" rx="8" fill="#FFFFFF" stroke="#446491" stroke-width="1.5"/>
      <rect x="5" y="5" width="145" height="20" rx="4" fill="#446491"/>
      <text x="77" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 1 (GIL Propio)</text>
      <text x="77" y="45" font-family="'Inter', sans-serif" font-size="9" fill="#4B89AC" text-anchor="middle">Memoria Aislada</text>
      <rect x="25" y="55" width="105" height="20" rx="4" fill="#E4FCF9"/>
      <text x="77" y="69" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#446491" text-anchor="middle">Núcleo 1 ⚡</text>

      <!-- Proc 2 -->
      <rect x="175" y="0" width="155" height="82" rx="8" fill="#FFFFFF" stroke="#4B89AC" stroke-width="1.5"/>
      <rect x="180" y="5" width="145" height="20" rx="4" fill="#4B89AC"/>
      <text x="252" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 2 (GIL Propio)</text>
      <text x="252" y="45" font-family="'Inter', sans-serif" font-size="9" fill="#4B89AC" text-anchor="middle">Memoria Aislada</text>
      <rect x="200" y="55" width="105" height="20" rx="4" fill="#E4FCF9"/>
      <text x="252" y="69" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#446491" text-anchor="middle">Núcleo 2 ⚡</text>

      <!-- Proc 3 -->
      <rect x="0" y="92" width="155" height="82" rx="8" fill="#FFFFFF" stroke="#446491" stroke-width="1.5"/>
      <rect x="5" y="97" width="145" height="20" rx="4" fill="#446491"/>
      <text x="77" y="111" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 3 (GIL Propio)</text>
      <text x="77" y="137" font-family="'Inter', sans-serif" font-size="9" fill="#4B89AC" text-anchor="middle">Memoria Aislada</text>
      <rect x="25" y="147" width="105" height="20" rx="4" fill="#E4FCF9"/>
      <text x="77" y="161" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#446491" text-anchor="middle">Núcleo 3 ⚡</text>

      <!-- Proc 4 -->
      <rect x="175" y="92" width="155" height="82" rx="8" fill="#FFFFFF" stroke="#4B89AC" stroke-width="1.5"/>
      <rect x="180" y="97" width="145" height="20" rx="4" fill="#4B89AC"/>
      <text x="252" y="111" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proceso 4 (GIL Propio)</text>
      <text x="252" y="137" font-family="'Inter', sans-serif" font-size="9" fill="#4B89AC" text-anchor="middle">Memoria Aislada</text>
      <rect x="200" y="147" width="105" height="20" rx="4" fill="#E4FCF9"/>
      <text x="252" y="161" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#446491" text-anchor="middle">Núcleo 4 ⚡</text>
    </g>

    <!-- Bottom Verdict -->
    <rect x="25" y="248" width="330" height="68" rx="8" fill="#E4FCF9" stroke="#ACE6F6" stroke-width="1.5"/>
    <text x="35" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#446491">
      ⚡ Recomendado para: CPU Bound
    </text>
    <text x="35" y="286" font-family="'Inter', sans-serif" font-size="10" fill="#4B89AC">
      Cálculos intensivos, matrices, Machine Learning, `Pool.map`.
    </text>
    <text x="35" y="304" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#2E7D32">
      ✔ Ejecución física verdaderamente paralela.
    </text>
  </g>
</svg>
