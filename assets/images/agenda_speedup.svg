<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 175" width="100%" height="100%">
  <defs>
    <linearGradient id="sGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4FCF9" />
      <stop offset="100%" stop-color="#D2F6F0" />
    </linearGradient>
    <linearGradient id="sGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#446491" />
      <stop offset="100%" stop-color="#223654" />
    </linearGradient>
    <filter id="sShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#122034" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="2" y="2" width="336" height="171" rx="12" fill="url(#sGrad1)" stroke="#ACE6F6" stroke-width="1.8" />

  <!-- Top Header Row -->
  <rect x="12" y="10" width="104" height="26" rx="6" fill="url(#sGradNavy)" filter="url(#sShadow)" />
  <text x="64" y="27" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">RENDIMIENTO</text>

  <!-- Speedup Formula Pill -->
  <rect x="124" y="10" width="204" height="26" rx="6" fill="#FFFFFF" stroke="rgba(68, 100, 145, 0.35)" />
  <text x="226" y="27" fill="#122034" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">Speedup S = T_seq / T_par</text>

  <!-- Speedup Visual Mini Chart -->
  <g transform="translate(12, 44)" filter="url(#sShadow)">
    <rect x="0" y="0" width="316" height="58" rx="8" fill="#0D1624" stroke="#446491" stroke-width="1" />
    
    <!-- Coordinate Lines -->
    <line x1="20" y1="48" x2="300" y2="48" stroke="#243B55" stroke-width="1.5" />
    <line x1="20" y1="10" x2="20" y2="48" stroke="#243B55" stroke-width="1.5" />
    
    <!-- Ideal Linear Speedup (Dashed) -->
    <line x1="20" y1="48" x2="290" y2="12" stroke="#ACE6F6" stroke-width="2" stroke-dasharray="4,3" />
    <text x="292" y="16" fill="#ACE6F6" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800">Ideal (Lineal)</text>

    <!-- Amdahl Real Asymptote Curve -->
    <path d="M20 48 Q 120 22, 290 26" fill="none" stroke="#4B89AC" stroke-width="3" />
    <text x="180" y="38" fill="#E4FCF9" font-family="'Outfit', sans-serif" font-size="9" font-weight="800">Ley de Amdahl (Límite Real)</text>

    <!-- Point Marker -->
    <circle cx="110" cy="30" r="4.5" fill="#ACE6F6" stroke="#122034" stroke-width="1.5" />
    <text x="110" y="22" fill="#ACE6F6" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">p=4</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="12" y="112" width="316" height="50" rx="8" fill="#FFFFFF" stroke="rgba(75, 137, 172, 0.35)" filter="url(#sShadow)" />
  <rect x="20" y="122" width="28" height="28" rx="6" fill="#446491" />
  <text x="34" y="141" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" text-anchor="middle">S</text>
  <text x="56" y="132" fill="#122034" font-family="'Outfit', sans-serif" font-size="11" font-weight="800">Métricas: Speedup &amp; Eficiencia</text>
  <text x="56" y="148" fill="#4B89AC" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">Eficiencia E = S / p • Ley de Amdahl</text>
</svg>
