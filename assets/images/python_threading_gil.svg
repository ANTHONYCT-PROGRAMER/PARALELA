<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <linearGradient id="thBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2FBFA"/>
    </linearGradient>
    <filter id="thSh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#446491" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="500" height="300" rx="14" fill="url(#thBg)" stroke="#4B89AC" stroke-width="2" filter="url(#thSh)"/>
  
  <rect x="10" y="10" width="500" height="38" rx="14" fill="#446491"/>
  <rect x="10" y="32" width="500" height="16" fill="#446491"/>
  <text x="260" y="34" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    ARQUITECTURA THREADING &amp; GIL EN PYTHON
  </text>

  <!-- 1 Process box -->
  <g transform="translate(25, 60)">
    <rect width="470" height="155" rx="10" fill="#FFFFFF" stroke="#446491" stroke-width="1.8" stroke-dasharray="4"/>
    <text x="15" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#446491">
      1 Proceso CPython (Memoria Compartida)
    </text>

    <!-- GIL Lock Bar -->
    <rect x="15" y="34" width="440" height="32" rx="6" fill="#446491"/>
    <text x="235" y="55" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#ACE6F6" text-anchor="middle">
      [CERROJO MUTEX] GIL: Global Interpreter Lock
    </text>

    <!-- Thread 1 (Running) -->
    <g transform="translate(20, 78)">
      <rect width="130" height="60" rx="6" fill="#4B89AC"/>
      <text x="65" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hilo 1 (Activo)</text>
      <rect x="15" y="34" width="100" height="18" rx="4" fill="#E4FCF9"/>
      <text x="65" y="47" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#2E7D32" text-anchor="middle">Ejecuta Bytecode</text>
    </g>

    <!-- Thread 2 (Waiting) -->
    <g transform="translate(170, 78)">
      <rect width="130" height="60" rx="6" fill="#A0BAC8"/>
      <text x="65" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hilo 2 (Espera)</text>
      <rect x="15" y="34" width="100" height="18" rx="4" fill="#FFFFFF"/>
      <text x="65" y="47" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#D32F2F" text-anchor="middle">Bloqueado por GIL</text>
    </g>

    <!-- Thread 3 (I/O sleep) -->
    <g transform="translate(320, 78)">
      <rect width="130" height="60" rx="6" fill="#E4FCF9" stroke="#4B89AC" stroke-width="1.2"/>
      <text x="65" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#446491" text-anchor="middle">Hilo 3 (I/O Sleep)</text>
      <rect x="15" y="34" width="100" height="18" rx="4" fill="#4B89AC"/>
      <text x="65" y="47" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Libera el GIL</text>
    </g>
  </g>

  <!-- Bottom Recommendation Banner -->
  <g transform="translate(25, 230)">
    <rect width="470" height="62" rx="8" fill="#E4FCF9" stroke="#ACE6F6" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#446491">
      USO RECOMENDADO: TAREAS I/O BOUND
    </text>
    <text x="15" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#4B89AC">
      Descargas web, sockets, lectura de disco y consultas de base de datos.
    </text>
  </g>
</svg>
