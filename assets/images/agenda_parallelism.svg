<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 175" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4FCF9" />
      <stop offset="100%" stop-color="#D2F6F0" />
    </linearGradient>
    <linearGradient id="pGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#446491" />
      <stop offset="100%" stop-color="#223654" />
    </linearGradient>
    <linearGradient id="pGradOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B89AC" />
      <stop offset="100%" stop-color="#31607C" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#122034" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="2" y="2" width="336" height="171" rx="12" fill="url(#pGrad1)" stroke="#ACE6F6" stroke-width="1.8" />

  <!-- Top Header Row -->
  <rect x="12" y="10" width="104" height="26" rx="6" fill="url(#pGradOcean)" filter="url(#pShadow)" />
  <text x="64" y="27" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">CPU 4 NÚCLEOS</text>

  <!-- Time Axis Arrow -->
  <line x1="128" y1="23" x2="315" y2="23" stroke="#4B89AC" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="322,23 314,19 314,27" fill="#4B89AC" />
  <text x="306" y="15" fill="#4B89AC" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800">Tiempo (t)</text>

  <!-- 2 Parallel Active Hardware Execution Streams (Simultaneous 100%) -->
  <!-- Core 0 Stream -->
  <g filter="url(#pShadow)">
    <rect x="12" y="46" width="58" height="26" rx="6" fill="#142238" />
    <text x="41" y="63" fill="#ACE6F6" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" text-anchor="middle">Core 0</text>
    <rect x="76" y="46" width="252" height="26" rx="6" fill="#446491" stroke="#ACE6F6" stroke-width="1.2" />
    <text x="202" y="63" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">Hilo 0 en ejecución continua (100%)</text>
  </g>

  <!-- Core 1 Stream -->
  <g filter="url(#pShadow)">
    <rect x="12" y="76" width="58" height="26" rx="6" fill="#142238" />
    <text x="41" y="93" fill="#ACE6F6" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" text-anchor="middle">Core 1</text>
    <rect x="76" y="76" width="252" height="26" rx="6" fill="#4B89AC" stroke="#ACE6F6" stroke-width="1.2" />
    <text x="202" y="93" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">Hilo 1 en ejecución continua (100%)</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="12" y="112" width="316" height="50" rx="8" fill="#FFFFFF" stroke="rgba(75, 137, 172, 0.35)" filter="url(#pShadow)" />
  <rect x="20" y="122" width="28" height="28" rx="6" fill="#4B89AC" />
  <text x="34" y="141" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" text-anchor="middle">4C</text>
  <text x="56" y="132" fill="#122034" font-family="'Outfit', sans-serif" font-size="11" font-weight="800">Paralelismo: Simultaneidad Física</text>
  <text x="56" y="148" fill="#4B89AC" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">Múltiples instrucciones en el mismo ciclo de reloj</text>
</svg>
